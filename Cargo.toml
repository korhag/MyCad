[workspace]
resolver = "2"
members = [
    "crates/cad-core",
    "crates/cad-viewport",
    "crates/cad-render",
    "crates/dwg-import",
    "crates/mycad",
]

[workspace.package]
version = "0.6.1"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["MyCad"]
rust-version = "1.80"

[workspace.dependencies]
cad-core = { path = "crates/cad-core" }
cad-viewport = { path = "crates/cad-viewport" }
cad-render = { path = "crates/cad-render" }
dwg-import = { path = "crates/dwg-import" }

bytemuck = { version = "1.22", features = ["derive"] }
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "persistence",
    "wgpu",
    "wayland",
    "x11",
] }
egui = "0.32"
egui-wgpu = "0.32"
libredwg-sys = "0.1"
libc = "0.2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui_dock = { version = "0.17", features = ["serde"] }
egui-phosphor = "0.10"
thiserror = "2"

# MSVC 14.41 ICEs on vendored LibreDWG decode.c at /O2 (C1001, 0xC0000005).
[profile.release.package."libredwg-sys"]
opt-level = 1

# rustc on Windows MSVC can STATUS_HEAP_CORRUPTION while codegenning mycad
# at the default 16 release codegen-units. One unit keeps cargo run --release stable.
[profile.release.package.mycad]
codegen-units = 1
