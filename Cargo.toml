[workspace]
resolver = "2"
members = [
    "crates/cad-core",
    "crates/cad-viewport",
    "crates/cad-render",
    "crates/cad-io",
    "crates/dwg-import",
    "crates/mycad",
]

[workspace.package]
version = "0.44.2"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Entomak"]
rust-version = "1.80"

[workspace.dependencies]
cad-core = { path = "crates/cad-core" }
cad-viewport = { path = "crates/cad-viewport" }
cad-render = { path = "crates/cad-render" }
cad-io = { path = "crates/cad-io" }
dwg-import = { path = "crates/dwg-import" }

bytemuck = { version = "1.22", features = ["derive"] }
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "persistence",
    "wgpu",
    "wayland",
    "x11",
] }
egui = "0.32"
egui-wgpu = "0.32"
libredwg-sys = "0.1"
libc = "0.2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui_dock = { version = "0.17", features = ["serde"] }
egui-phosphor = "0.10"
thiserror = "2"
earcutr = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

# Dependencies stay optimized in dev so snap and tessellation match a real session.
[profile.dev.package."*"]
opt-level = 2

# MSVC 14.41 ICEs on vendored LibreDWG decode.c at /O2 (C1001, 0xC0000005).
[profile.dev.package."libredwg-sys"]
opt-level = 1

# MSVC 14.41 ICEs on vendored LibreDWG decode.c at /O2 (C1001, 0xC0000005).
[profile.release.package."libredwg-sys"]
opt-level = 1

# rustc on Windows MSVC can STATUS_HEAP_CORRUPTION while codegenning mycad
# at the default 16 release codegen-units. One unit keeps cargo run --release stable.
[profile.release.package.mycad]
codegen-units = 1

# Local LibreDWG. The registry crate is unmodified 0.13.3, whose R2000
# writer drops entity links and leaves header unit ratios at 0.
[patch.crates-io]
libredwg-sys = { path = "vendor/libredwg-sys" }
