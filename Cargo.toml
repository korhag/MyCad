[workspace]
resolver = "2"
members = [
    "crates/cad-core",
    "crates/cad-viewport",
    "crates/cad-render",
    "crates/dwg-import",
    "crates/mycad",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["MyCad"]
rust-version = "1.80"

[workspace.dependencies]
cad-core = { path = "crates/cad-core" }
cad-viewport = { path = "crates/cad-viewport" }
cad-render = { path = "crates/cad-render" }
dwg-import = { path = "crates/dwg-import" }

bytemuck = { version = "1.22", features = ["derive"] }
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "persistence",
    "wgpu",
    "wayland",
    "x11",
] }
egui = "0.32"
egui-wgpu = "0.32"
libredwg-sys = "0.1"
libc = "0.2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
