[package]
name = "mycad"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Linux-native 2D CAD application (Milestone 1: DWG viewer)"

[[bin]]
name = "mycad"
path = "src/main.rs"

[features]
default = []
perf = ["cad-core/perf"]

[dependencies]
cad-core.workspace = true
cad-viewport.workspace = true
cad-render.workspace = true
cad-io.workspace = true
dwg-import.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui_dock = { workspace = true }
egui-phosphor = { workspace = true }
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
ron = "0.10"
